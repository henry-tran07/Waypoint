name: Mira
options:
  bundleIdPrefix: com.mira
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "15"
packages:
  SwiftAnthropic:
    url: https://github.com/jamesrochabrun/SwiftAnthropic
    from: "2.0.0"
targets:
  Mira:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Mira
    dependencies:
      - package: SwiftAnthropic
        product: SwiftAnthropic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evacab.mira
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Mira/Info.plist
        SWIFT_VERSION: "5.9"
        ENABLE_BITCODE: "NO"
    entitlements:
      path: Mira/Mira.entitlements
